name: Score landings and publish

on:
  schedule:
    - cron: "17 7 * * *"   # nightly, about 3 AM Eastern
  workflow_dispatch:
    inputs:
      fleet:
        description: "Rebuild the fleet benchmark too"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          node tests/score.test.js

      - name: Restore cache (traces, weather, runways, fleet)
        uses: actions/cache@v4
        with:
          path: .cache
          key: debrief-${{ github.run_id }}
          restore-keys: debrief-

      - name: Score tracked tails
        run: python -m debrief --tails-file tails.txt --days 365 --out site/data --cache .cache

      - name: Fleet benchmark (Sundays, on request, or when missing)
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.fleet }}" = "true" ] || [ ! -f .cache/fleet/SF50.json ]; then
            python -m debrief.fleet SF50 --sample 40 --days 45 --cache .cache --out .cache/fleet --exclude $(grep -v '^#' tails.txt | tr '\n' ' ')
          fi

      - name: Add fleet files to the site
        run: |
          mkdir -p site/data/fleet
          cp .cache/fleet/*.json site/data/fleet/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
