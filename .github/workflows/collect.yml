name: Collect landings and publish

# Every 3 hours: score the newest unprocessed days from adsb.lol (yesterday first, then
# backfill toward BACKFILL_SINCE), save state to the `data` branch, deploy GitHub Pages.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Most days to process this run"
        default: "10"
      day:
        description: "Process one specific day (YYYY-MM-DD) instead of the queue"
        default: ""
      repeat:
        description: "Runs to chain back to back (each starts the next when it finishes)"
        default: "1"
  push:
    branches: [main]
    paths: ["site/**", "tools/**", "debrief/**", ".github/workflows/collect.yml"]

env:
  PYTHONUNBUFFERED: "1"
  FLEET_TYPE: SF50
  BACKFILL_SINCE: "2025-10-13"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Fetch saved state (data branch)
        run: git clone --depth 1 --branch data "https://github.com/${{ github.repository }}" data || mkdir -p data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install cryptography

      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          node tests/score.test.js

      - name: Restore cache (FAA registry, runways, weather, last raw days)
        uses: actions/cache@v4
        with:
          path: .cache
          key: collect-${{ github.run_id }}
          restore-keys: collect-

      - name: Collect
        id: collect
        env:
          SML_SECRET: ${{ secrets.SML_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m debrief.collect --type "$FLEET_TYPE" --data data --cache .cache --publish-only
          elif [ -n "${{ inputs.day }}" ]; then
            python -m debrief.collect --type "$FLEET_TYPE" --data data --cache .cache --day "${{ inputs.day }}"
          else
            python -m debrief.collect --type "$FLEET_TYPE" --data data --cache .cache \
              --since "$BACKFILL_SINCE" --max-days "${{ inputs.days || '10' }}" --max-minutes 200
          fi

      - name: Summarize fleet
        run: node tools/summarize.js data/public

      - name: Privacy gate
        id: privacy
        run: python tools/privacy_check.py data/public --type "$FLEET_TYPE" --cache .cache

      # Post-flight email to subscribed owners. Skips quietly without SML_SUBSCRIBERS and
      # SMTP secrets; never fails the run. Logs never name a tail or an address.
      - name: Post-flight emails
        if: github.event_name != 'push' && steps.privacy.outcome == 'success'
        continue-on-error: true
        env:
          SML_SECRET: ${{ secrets.SML_SECRET }}
          SML_SUBSCRIBERS: ${{ secrets.SML_SUBSCRIBERS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [ -z "$SML_SUBSCRIBERS" ] || [ -z "$SMTP_USER" ]; then echo "post-flight email not configured"; exit 0; fi
          python -m debrief.notify --type "$FLEET_TYPE" --data data --cache .cache --out /tmp/notify_out

      # Runs even when the privacy gate fails, so hours of collection aren't thrown away.
      # The encrypted state is kept; the public folder is dropped (it's rebuilt every run).
      - name: Save state to the data branch
        if: ${{ !cancelled() && github.event_name != 'push' && steps.collect.outcome == 'success' }}
        run: |
          cd data
          if [ "${{ steps.privacy.outcome }}" != "success" ]; then rm -rf public; echo "Privacy gate failed: saved state only"; fi
          rm -rf .git
          git init -q -b data
          git add -A
          git -c user.name="scoremylanding bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Data through $(python3 -c 'import json;d=json.load(open("meta/days.json"));print(max(d) if d else "none")')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          rm -rf _site/data
          cp -r data/public _site/data
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Back-to-back backfill: start the next run as soon as this one has deployed.
  chain:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && fromJSON(inputs.repeat || '1') > 1
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run collect.yml -R "${{ github.repository }}" --ref main \
            -f days="${{ inputs.days }}" -f repeat="$(( ${{ inputs.repeat }} - 1 ))"
          echo "Started the next run; $(( ${{ inputs.repeat }} - 1 )) to go."
